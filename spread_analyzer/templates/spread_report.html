<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetaTrader 5 Spread Analyzer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Plotly.js CDN -->
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0B0F19;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .sort-th {
            cursor: pointer;
            user-select: none;
            transition: color 0.15s ease;
        }
        .sort-th:hover {
            color: #FFFFFF !important;
        }
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0B0F19;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1F2937;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #374151;
        }
        [x-cloak] { display: none !important; }
    </style>
    <!-- Direct data shim for double-click offline viewing (file://) -->
    <script src="report_data.js"></script>
</head>
<body class="text-gray-200 min-h-screen p-4 md:p-8" x-data="spreadViewer()" x-init="init()" @dragover.prevent="dragOver = true" @dragleave.prevent="dragOver = false" @drop.prevent="handleDrop($event)">

    <!-- Drag & Drop Visual Indicator -->
    <div x-show="dragOver" x-cloak class="fixed inset-0 z-50 bg-blue-900/40 backdrop-blur-sm border-4 border-dashed border-blue-500 flex items-center justify-center pointer-events-none">
        <div class="bg-gray-900 border border-blue-500 px-8 py-6 rounded-2xl shadow-2xl text-center">
            <span class="text-4xl block mb-2">📥</span>
            <span class="text-xl font-bold text-white block">Drop report_data.json here</span>
            <span class="text-xs text-gray-400">Load spread analytics into viewer instantly</span>
        </div>
    </div>

    <div class="max-w-[1440px] mx-auto space-y-6">

        <!-- Header -->
        <div class="flex flex-col md:flex-row md:items-center justify-between border-b border-gray-800 pb-5 gap-4">
            <div>
                <div class="flex items-center gap-3">
                    <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-white">MetaTrader 5 Spread Analyzer</h1>
                    <span class="px-2.5 py-0.5 rounded text-xs font-semibold bg-blue-900/60 text-blue-400 border border-blue-700/50">1-Minute Dynamics</span>
                </div>
                <p class="text-sm text-gray-400 mt-1">High-frequency spread dynamics (Floating Range Bars & Step Corridor with Tick Activity)</p>
            </div>

            <div class="flex flex-wrap items-center gap-3">
                <!-- Metadata Badges -->
                <template x-if="data">
                    <div class="flex items-center gap-4 text-xs font-mono bg-gray-900/80 px-4 py-2.5 rounded-lg border border-gray-800">
                        <div>
                            <span class="text-gray-500 block">ACCOUNT / BROKER</span>
                            <span class="text-gray-200 font-semibold" x-text="data.account_tag || 'Unknown'"></span>
                        </div>
                        <div class="h-6 w-px bg-gray-800"></div>
                        <div>
                            <span class="text-gray-500 block">DATE RANGE (UTC)</span>
                            <span class="text-gray-200 font-semibold" x-text="data.date_range || 'N/A'"></span>
                        </div>
                        <div class="h-6 w-px bg-gray-800"></div>
                        <div>
                            <span class="text-gray-500 block">EXECUTION METRIC</span>
                            <span class="text-cyan-400 font-semibold uppercase" x-text="data.metric_basis || 'median'"></span>
                        </div>
                    </div>
                </template>

                <!-- Load File Button -->
                <div>
                    <input type="file" id="fileInput" accept=".json" class="hidden" @change="handleFileInput($event)">
                    <button @click="document.getElementById('fileInput').click()" class="px-3 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300 hover:text-white border border-gray-700 text-xs font-medium transition flex items-center gap-1.5 shadow-sm">
                        <span>📂</span> Load JSON
                    </button>
                </div>
            </div>
        </div>

        <!-- No Data Alert / Placeholder -->
        <template x-if="!data && !loading">
            <div class="bg-gray-900/80 border border-dashed border-gray-700 rounded-2xl p-12 text-center max-w-xl mx-auto my-12 space-y-4">
                <div class="text-5xl">📊</div>
                <h3 class="text-xl font-bold text-white">No Spread Data Loaded</h3>
                <p class="text-sm text-gray-400">
                    No <code class="text-cyan-400 font-mono">report_data.js</code> was detected in this folder. Drop a <code class="text-cyan-400 font-mono">report_data.json</code> file anywhere on this window or click below to browse.
                </p>
                <button @click="document.getElementById('fileInput').click()" class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold transition inline-flex items-center gap-2 shadow-lg shadow-blue-600/20">
                    <span>📂</span> Choose report_data.json
                </button>
            </div>
        </template>

        <!-- Main Dashboard (shown when data is loaded) -->
        <template x-if="data">
            <div class="space-y-6">

                <!-- Comprehensive Multi-Symbol Summary Table -->
                <div class="bg-gray-900/60 rounded-xl border border-gray-800 overflow-hidden shadow-xl">
                    <div class="p-5 border-b border-gray-800 flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                            <h2 class="text-lg font-semibold text-white">Comprehensive Symbol Summary</h2>
                            <p class="text-xs text-gray-400">Click any column header to sort • Click any row to view its 1-minute spread chart</p>
                        </div>
                        <div class="flex flex-wrap items-center gap-4">
                            <!-- Search Box -->
                            <div class="relative w-full sm:w-64">
                                <input type="text" x-model="search" placeholder="Filter symbol (e.g. EURUSD)..." class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-1.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 font-mono">
                            </div>
                            <div class="text-xs text-gray-400">
                                <span class="inline-block w-2.5 h-2.5 rounded-full bg-green-500 mr-1"></span>Min
                                <span class="inline-block w-2.5 h-2.5 rounded-full bg-orange-500 ml-3 mr-1"></span>Avg
                                <span class="inline-block w-2.5 h-2.5 rounded-full bg-red-500 ml-3 mr-1"></span>Max
                            </div>
                        </div>
                    </div>
                    <div class="overflow-x-auto custom-scrollbar">
                        <table class="w-full text-left text-sm border-collapse">
                            <thead class="bg-gray-950/80 text-xs uppercase text-gray-400 font-semibold border-b border-gray-800">
                                <tr>
                                    <th @click="sortBy('symbol')" class="sort-th px-4 py-3"><span class="flex items-center gap-1.5">Symbol <span class="text-[10px]" :class="sortCol === 'symbol' ? 'text-blue-400' : 'text-gray-600'" x-text="getSortIcon('symbol')"></span></span></th>
                                    <th @click="sortBy('unit')" class="sort-th px-4 py-3"><span class="flex items-center gap-1.5">Unit <span class="text-[10px]" :class="sortCol === 'unit' ? 'text-blue-400' : 'text-gray-600'" x-text="getSortIcon('unit')"></span></span></th>
                                    <th @click="sortBy('min_spread')" class="sort-th px-4 py-3 text-green-400"><span class="flex items-center gap-1.5">Min Spread <span class="text-[10px]" :class="sortCol === 'min_spread' ? 'text-blue-400' : 'text-gray-600'" x-text="getSortIcon('min_spread')"></span></span></th>
                                    <th @click="sortBy('median_spread')" class="sort-th px-4 py-3 text-gray-300"><span class="flex items-center gap-1.5">Median <span class="text-[10px]" :class="sortCol === 'median_spread' ? 'text-blue-400' : 'text-gray-600'" x-text="getSortIcon('median_spread')"></span></span></th>
                                    <th @click="sortBy('avg_spread')" class="sort-th px-4 py-3 text-amber-400"><span class="flex items-center gap-1.5">Avg Spread <span class="text-[10px]" :class="sortCol === 'avg_spread' ? 'text-blue-400' : 'text-gray-600'" x-text="getSortIcon('avg_spread')"></span></span></th>
                                    <th @click="sortBy('p95_spread')" class="sort-th px-4 py-3 text-gray-300"><span class="flex items-center gap-1.5">P95 <span class="text-[10px]" :class="sortCol === 'p95_spread' ? 'text-blue-400' : 'text-gray-600'" x-text="getSortIcon('p95_spread')"></span></span></th>
                                    <th @click="sortBy('max_spread')" class="sort-th px-4 py-3 text-red-400"><span class="flex items-center gap-1.5">Max Spread <span class="text-[10px]" :class="sortCol === 'max_spread' ? 'text-blue-400' : 'text-gray-600'" x-text="getSortIcon('max_spread')"></span></span></th>
                                    <th @click="sortBy('spread_bps')" class="sort-th px-4 py-3 text-cyan-400 whitespace-nowrap min-w-[115px]"><span class="flex items-center gap-1.5">Spread (bps) <span class="text-[10px]" :class="sortCol === 'spread_bps' ? 'text-blue-400' : 'text-gray-600'" x-text="getSortIcon('spread_bps')"></span></span></th>
                                    <th @click="sortBy('spread_to_vol_pct')" class="sort-th px-4 py-3 text-cyan-400 whitespace-nowrap min-w-[110px]"><span class="flex items-center gap-1.5">Spread / Vol <span class="text-[10px]" :class="sortCol === 'spread_to_vol_pct' ? 'text-blue-400' : 'text-gray-600'" x-text="getSortIcon('spread_to_vol_pct')"></span></span></th>
                                    <th @click="sortBy('avg_daily_volatility_pct')" class="sort-th px-4 py-3 whitespace-nowrap min-w-[110px]"><span class="flex items-center gap-1.5">Daily Vol (%) <span class="text-[10px]" :class="sortCol === 'avg_daily_volatility_pct' ? 'text-blue-400' : 'text-gray-600'" x-text="getSortIcon('avg_daily_volatility_pct')"></span></span></th>
                                    <th @click="sortBy('total_ticks')" class="sort-th px-4 py-3"><span class="flex items-center gap-1.5">Total Ticks <span class="text-[10px]" :class="sortCol === 'total_ticks' ? 'text-blue-400' : 'text-gray-600'" x-text="getSortIcon('total_ticks')"></span></span></th>
                                    <th @click="sortBy('sampled_minutes')" class="sort-th px-4 py-3"><span class="flex items-center gap-1.5">M1 Bars <span class="text-[10px]" :class="sortCol === 'sampled_minutes' ? 'text-blue-400' : 'text-gray-600'" x-text="getSortIcon('sampled_minutes')"></span></span></th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-800/60">
                                <template x-for="m in sortedSymbols" :key="m.symbol">
                                    <tr @click="selectSymbol(m.symbol)" :class="selectedSymbol === m.symbol ? 'bg-blue-950/40 border-l-2 border-blue-500' : 'hover:bg-gray-800'" class="cursor-pointer transition">
                                        <td class="px-4 py-3 font-semibold text-blue-400" x-text="m.symbol"></td>
                                        <td class="px-4 py-3 text-gray-400" x-text="m.unit"></td>
                                        <td class="px-4 py-3 text-green-400 font-mono" x-text="formatNum(m.min_spread)"></td>
                                        <td class="px-4 py-3 text-gray-300 font-mono" x-text="formatNum(m.median_spread)"></td>
                                        <td class="px-4 py-3 text-amber-400 font-mono font-medium" x-text="formatNum(m.avg_spread)"></td>
                                        <td class="px-4 py-3 text-gray-300 font-mono" x-text="formatNum(m.p95_spread)"></td>
                                        <td class="px-4 py-3 text-red-400 font-mono" x-text="formatNum(m.max_spread)"></td>
                                        <td class="px-4 py-3">
                                            <span class="px-2 py-0.5 rounded text-xs font-mono font-medium whitespace-nowrap border"
                                                  :class="m.spread_bps < 1 ? 'bg-emerald-950/80 text-emerald-400 border-emerald-800/60' : (m.spread_bps <= 5 ? 'bg-amber-950/80 text-amber-400 border-amber-800/60' : 'bg-rose-950/80 text-rose-400 border-rose-800/60')"
                                                  x-text="formatNum(m.spread_bps) + ' bps'"></span>
                                        </td>
                                        <td class="px-4 py-3">
                                            <span class="px-2 py-0.5 rounded text-xs font-mono font-medium border"
                                                  :class="m.spread_to_vol_pct < 2 ? 'bg-emerald-950/80 text-emerald-400 border-emerald-800/60' : (m.spread_to_vol_pct <= 5 ? 'bg-amber-950/80 text-amber-400 border-amber-800/60' : 'bg-rose-950/80 text-rose-400 border-rose-800/60')"
                                                  x-text="formatNum(m.spread_to_vol_pct) + '%'"></span>
                                        </td>
                                        <td class="px-4 py-3 text-gray-300 font-mono cursor-help" :title="formatNum(m.avg_daily_volatility, 1) + ' ' + m.unit" x-text="formatNum(m.avg_daily_volatility_pct) + '%'"></td>
                                        <td class="px-4 py-3 text-gray-400 font-mono" x-text="formatInt(m.total_ticks)"></td>
                                        <td class="px-4 py-3 text-gray-400 font-mono" x-text="formatInt(m.sampled_minutes)"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Chart Section with Symbol Selector & View Mode Switcher -->
                <div class="bg-gray-900/60 rounded-xl border border-gray-800 p-5 shadow-xl space-y-4">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                            <div class="flex items-center gap-3">
                                <h2 class="text-lg font-semibold text-white">1-Minute Spread Dynamics</h2>
                                <span class="px-2 py-0.5 rounded text-[11px] font-mono bg-blue-950/80 text-blue-400 border border-blue-800/60">Dual Subplot (Spread + Ticks)</span>
                            </div>
                            <p class="text-xs text-gray-400 mt-0.5" x-text="viewMode === 'range_bars' ? 'Cyan 1-minute Min-Max floating bars with Average spread line overlay and Tick Activity volume' : '1-minute Min-Max step corridor (Emerald Min to Rose-Red Max) with Average spread step line and Tick Activity volume'"></p>
                        </div>
                        <div class="flex flex-wrap items-center gap-4">
                            <!-- View Mode Toggle -->
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-semibold text-gray-400">VIEW:</span>
                                <div class="inline-flex rounded-lg p-1 bg-gray-950/80 border border-gray-800 text-xs">
                                    <button @click="setViewMode('range_bars')" :class="viewMode === 'range_bars' ? 'text-white bg-sky-600 shadow' : 'text-gray-400 hover:text-white'" class="px-3 py-1.5 rounded-md transition font-medium text-xs">Range Bars</button>
                                    <button @click="setViewMode('step_corridor')" :class="viewMode === 'step_corridor' ? 'text-white bg-emerald-600 shadow' : 'text-gray-400 hover:text-white'" class="px-3 py-1.5 rounded-md transition font-medium text-xs">Step Corridor</button>
                                </div>
                            </div>

                            <!-- Symbol Selector -->
                            <div class="flex items-center gap-2">
                                <label for="symbolSelect" class="text-xs font-semibold text-gray-400">SYMBOL:</label>
                                <select id="symbolSelect" x-model="selectedSymbol" @change="renderChart()" class="bg-gray-800 border border-gray-700 text-white text-sm rounded-lg px-3 py-1.5 focus:ring-blue-500 focus:border-blue-500 font-semibold">
                                    <template x-for="s in symbolList" :key="s">
                                        <option :value="s" x-text="s"></option>
                                    </template>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Plotly Chart Container -->
                    <div id="chartContainer" class="w-full h-[560px] rounded-lg overflow-hidden border border-gray-800 bg-[#1F2937]"></div>
                </div>

            </div>
        </template>

        <!-- Footer -->
        <div class="text-center text-xs text-gray-500 pt-2 pb-6">
            Generated with MetaTrader 5 Spread Analyzer • High-frequency quantitative analytics
        </div>
    </div>

    <script>
        function spreadViewer() {
            return {
                data: null,
                selectedSymbol: '',
                viewMode: 'range_bars',
                search: '',
                sortCol: 'symbol',
                sortAsc: true,
                dragOver: false,
                loading: false,

                init() {
                    if (window.__REPORT_DATA__) {
                        this.loadData(window.__REPORT_DATA__);
                        return;
                    }
                    fetch('report_data.json')
                        .then(r => {
                            if (!r.ok) throw new Error('HTTP ' + r.status);
                            return r.json();
                        })
                        .then(json => this.loadData(json))
                        .catch(() => {
                            // No data found on init, waits for drag & drop or file browse
                        });
                },

                loadData(json) {
                    this.data = json;
                    if (json.symbols && json.symbols.length > 0) {
                        this.selectedSymbol = json.symbols[0].symbol;
                        this.$nextTick(() => {
                            this.renderChart();
                        });
                    }
                },

                handleDrop(event) {
                    this.dragOver = false;
                    const file = event.dataTransfer?.files?.[0];
                    if (file) this.readFile(file);
                },

                handleFileInput(event) {
                    const file = event.target.files?.[0];
                    if (file) this.readFile(file);
                },

                readFile(file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const json = JSON.parse(e.target.result);
                            this.loadData(json);
                        } catch (err) {
                            alert('Failed to parse JSON file: ' + err.message);
                        }
                    };
                    reader.readAsText(file);
                },

                get symbolList() {
                    if (!this.data || !this.data.symbols) return [];
                    return this.data.symbols.map(s => s.symbol).sort();
                },

                get sortedSymbols() {
                    if (!this.data || !this.data.symbols) return [];
                    let list = [...this.data.symbols];
                    if (this.search.trim()) {
                        const q = this.search.trim().toUpperCase();
                        list = list.filter(item => item.symbol.toUpperCase().includes(q));
                    }
                    const col = this.sortCol;
                    const asc = this.sortAsc;
                    list.sort((a, b) => {
                        const valA = a[col];
                        const valB = b[col];
                        if (typeof valA === 'number' && typeof valB === 'number') {
                            return asc ? valA - valB : valB - valA;
                        }
                        return asc ? String(valA).localeCompare(String(valB)) : String(valB).localeCompare(String(valA));
                    });
                    return list;
                },

                sortBy(col) {
                    if (this.sortCol === col) {
                        this.sortAsc = !this.sortAsc;
                    } else {
                        this.sortCol = col;
                        this.sortAsc = true;
                    }
                },

                getSortIcon(col) {
                    if (this.sortCol !== col) return '↕';
                    return this.sortAsc ? '▲' : '▼';
                },

                selectSymbol(sym) {
                    this.selectedSymbol = sym;
                    this.renderChart();
                },

                setViewMode(mode) {
                    this.viewMode = mode;
                    this.renderChart();
                },

                formatNum(val, dec = 2) {
                    if (val === undefined || val === null || isNaN(val)) return '-';
                    return Number(val).toFixed(dec);
                },

                formatInt(val) {
                    if (val === undefined || val === null || isNaN(val)) return '-';
                    return Number(val).toLocaleString();
                },

                renderChart() {
                    const container = document.getElementById('chartContainer');
                    if (!container || !this.data || !this.selectedSymbol) return;

                    const symChart = this.data.charts ? this.data.charts[this.selectedSymbol] : null;
                    const symMeta = this.data.symbols.find(s => s.symbol === this.selectedSymbol) || {};
                    const unit = symMeta.unit || 'pts';

                    if (!symChart || !symChart.times || symChart.times.length === 0) {
                        container.innerHTML = `<div class="flex items-center justify-center h-full text-gray-500 font-mono text-sm">No 1-minute chart data available for ${this.selectedSymbol}</div>`;
                        return;
                    }

                    const times = symChart.times;
                    const mins = symChart.min;
                    const avgs = symChart.avg;
                    const maxs = symChart.max;
                    const counts = symChart.ticks;

                    const deltas = maxs.map((m, i) => m - mins[i]);
                    const customdata = times.map((_, i) => [mins[i], avgs[i], maxs[i], counts[i]]);

                    let traces = [];
                    const chartTypeName = this.viewMode === 'range_bars' ? 'Range Bars & Tick Volume' : 'Step Corridor & Tick Volume';

                    if (this.viewMode === 'range_bars') {
                        traces.push({
                            type: 'bar',
                            x: times,
                            base: mins,
                            y: deltas,
                            name: `Spread Range (${unit})`,
                            marker: {
                                color: 'rgba(14, 165, 233, 0.65)',
                                line: { color: '#38BDF8', width: 1.0 }
                            },
                            customdata: customdata,
                            hovertemplate: `<b>%{x|%Y-%m-%d %H:%M} UTC</b><br>Max: <b>%{customdata[2]:.2f} ${unit}</b><br>Avg: <b>%{customdata[1]:.2f} ${unit}</b><br>Min: <b>%{customdata[0]:.2f} ${unit}</b><br>Ticks: %{customdata[3]:,}<extra></extra>`,
                            xaxis: 'x',
                            yaxis: 'y'
                        });

                        traces.push({
                            type: 'scatter',
                            mode: 'lines',
                            x: times,
                            y: avgs,
                            name: `Avg Spread (${unit})`,
                            line: { color: '#F59E0B', width: 1.5 },
                            hoverinfo: 'skip',
                            xaxis: 'x',
                            yaxis: 'y'
                        });
                    } else {
                        traces.push({
                            type: 'scatter',
                            mode: 'lines',
                            x: times,
                            y: mins,
                            name: `Min Spread (${unit})`,
                            line: { color: 'rgba(16, 185, 129, 0.75)', width: 1.2, shape: 'hv' },
                            showlegend: false,
                            hoverinfo: 'skip',
                            xaxis: 'x',
                            yaxis: 'y'
                        });

                        traces.push({
                            type: 'scatter',
                            mode: 'lines',
                            x: times,
                            y: maxs,
                            fill: 'tonexty',
                            fillcolor: 'rgba(244, 63, 94, 0.14)',
                            name: `Min-Max Corridor (${unit})`,
                            line: { color: 'rgba(244, 63, 94, 0.85)', width: 1.2, shape: 'hv' },
                            customdata: customdata,
                            hovertemplate: `<b>%{x|%Y-%m-%d %H:%M} UTC</b><br>Max: <b>%{customdata[2]:.2f} ${unit}</b><br>Avg: <b>%{customdata[1]:.2f} ${unit}</b><br>Min: <b>%{customdata[0]:.2f} ${unit}</b><br>Ticks: %{customdata[3]:,}<extra></extra>`,
                            xaxis: 'x',
                            yaxis: 'y'
                        });

                        traces.push({
                            type: 'scatter',
                            mode: 'lines',
                            x: times,
                            y: avgs,
                            name: `Avg Spread (${unit})`,
                            line: { color: '#F97316', width: 2.0, shape: 'hv' },
                            hoverinfo: 'skip',
                            xaxis: 'x',
                            yaxis: 'y'
                        });
                    }

                    traces.push({
                        type: 'bar',
                        x: times,
                        y: counts,
                        name: 'Tick Count',
                        marker: { color: '#6366F1', opacity: 0.85 },
                        hovertemplate: '<b>%{x|%Y-%m-%d %H:%M} UTC</b><br>Ticks: <b>%{y:,}</b><extra></extra>',
                        xaxis: 'x',
                        yaxis: 'y2'
                    });

                    const is_24_7 = symMeta.is_24_7 || false;
                    const rangebreaks = is_24_7 ? [] : [{ bounds: ['sat', 'mon'] }];

                    const layout = {
                        title: {
                            text: `<b>${this.selectedSymbol}</b> — 1-Minute ${chartTypeName} (${unit})`,
                            font: { size: 18, color: '#F3F4F6' },
                            x: 0.01,
                            y: 0.97
                        },
                        paper_bgcolor: '#111827',
                        plot_bgcolor: '#1F2937',
                        font: { family: 'Inter, sans-serif', color: '#9CA3AF' },
                        margin: { l: 60, r: 30, t: 65, b: 45 },
                        hovermode: 'x',
                        legend: {
                            orientation: 'h',
                            yanchor: 'bottom',
                            y: 1.02,
                            xanchor: 'right',
                            x: 1.0,
                            bgcolor: 'rgba(17, 24, 39, 0.85)',
                            bordercolor: 'rgba(255, 255, 255, 0.1)',
                            borderwidth: 1,
                            font: { size: 12, color: '#E5E7EB' }
                        },
                        grid: {
                            rows: 2,
                            columns: 1,
                            subplots: [['xy'], ['xy2']],
                            roworder: 'top to bottom'
                        },
                        xaxis: {
                            gridcolor: '#374151',
                            gridwidth: 0.5,
                            showline: true,
                            linecolor: '#4B5563',
                            zeroline: false,
                            rangebreaks: rangebreaks,
                            rangeselector: {
                                buttons: [
                                    { count: 1, label: '1D', step: 'day', stepmode: 'backward' },
                                    { count: 3, label: '3D', step: 'day', stepmode: 'backward' },
                                    { count: 7, label: '1W', step: 'day', stepmode: 'backward' },
                                    { step: 'all', label: 'All' }
                                ],
                                bgcolor: '#1F2937',
                                activecolor: '#374151',
                                font: { color: '#E5E7EB', size: 11 }
                            }
                        },
                        yaxis: {
                            title: `Spread (${unit})`,
                            gridcolor: '#374151',
                            gridwidth: 0.5,
                            showline: true,
                            linecolor: '#4B5563',
                            zeroline: false,
                            domain: [0.27, 1.0]
                        },
                        yaxis2: {
                            title: 'Ticks/min',
                            gridcolor: '#374151',
                            gridwidth: 0.5,
                            showline: true,
                            linecolor: '#4B5563',
                            zeroline: false,
                            domain: [0.0, 0.23]
                        }
                    };

                    Plotly.react('chartContainer', traces, layout, {
                        responsive: true,
                        displayModeBar: true,
                        modeBarButtonsToRemove: ['lasso2d', 'select2d']
                    });
                }
            };
        }
    </script>
</body>
</html>
