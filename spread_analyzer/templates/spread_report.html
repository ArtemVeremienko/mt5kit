<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetaTrader 5 Spread Analyzer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Plotly.js CDN -->
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0B0F19;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .sort-th {
            cursor: pointer;
            user-select: none;
            transition: color 0.15s ease;
        }
        .sort-th:hover {
            color: #FFFFFF !important;
        }
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0B0F19;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1F2937;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #374151;
        }
        [x-cloak] { display: none !important; }
    </style>
    <!-- Direct data shim for double-click offline viewing (file://) -->
    <script src="report_data.js"></script>
</head>
<body class="text-gray-200 min-h-screen p-4 md:p-8" x-data="spreadViewer()" x-init="init()" @dragover.prevent="dragOver = true" @dragleave.prevent="dragOver = false" @drop.prevent="handleDrop($event)">

    <!-- Drag & Drop Visual Indicator -->
    <div x-show="dragOver" x-cloak class="fixed inset-0 z-50 bg-blue-900/40 backdrop-blur-sm border-4 border-dashed border-blue-500 flex items-center justify-center pointer-events-none">
        <div class="bg-gray-900 border border-blue-500 px-8 py-6 rounded-2xl shadow-2xl text-center">
            <span class="text-4xl block mb-2">📥</span>
            <span class="text-xl font-bold text-white block">Drop report_data.json here</span>
            <span class="text-xs text-gray-400">Load spread analytics into viewer instantly</span>
        </div>
    </div>

    <div class="max-w-[1440px] mx-auto space-y-6">

        <!-- Header -->
        <div class="flex flex-col md:flex-row md:items-center justify-between border-b border-gray-800 pb-5 gap-4">
            <div>
                <div class="flex items-center gap-3">
                    <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-white">MetaTrader 5 Spread Analyzer</h1>
                    <span class="px-2.5 py-0.5 rounded text-xs font-semibold bg-blue-900/60 text-blue-400 border border-blue-700/50">1-Minute Dynamics</span>
                </div>
                <p class="text-sm text-gray-400 mt-1">High-frequency spread dynamics (Floating Range Bars & Step Corridor with Tick Activity)</p>
            </div>

            <div class="flex flex-wrap items-center gap-3">
                <!-- Metadata Badges -->
                <template x-if="data">
                    <div class="flex items-center gap-4 text-xs font-mono bg-gray-900/80 px-4 py-2.5 rounded-lg border border-gray-800">
                        <div>
                            <span class="text-gray-500 block">ACCOUNT / BROKER</span>
                            <span class="text-gray-200 font-semibold" x-text="data.account_tag || 'Unknown'"></span>
                        </div>
                        <div class="h-6 w-px bg-gray-800"></div>
                        <div>
                            <span class="text-gray-500 block">DATE RANGE (UTC)</span>
                            <span class="text-gray-200 font-semibold" x-text="data.date_range || 'N/A'"></span>
                        </div>
                        <div class="h-6 w-px bg-gray-800"></div>
                        <div>
                            <span class="text-gray-500 block">BASE SPREAD</span>
                            <span class="text-cyan-400 font-semibold" title="Baseline intraday spread drag unpolluted by rollover spikes">MEDIAN (BPS)</span>
                        </div>
                    </div>
                </template>

                <!-- Load File Button -->
                <div>
                    <input type="file" id="fileInput" accept=".json" class="hidden" @change="handleFileInput($event)">
                    <button @click="document.getElementById('fileInput').click()" class="px-3 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300 hover:text-white border border-gray-700 text-xs font-medium transition flex items-center gap-1.5 shadow-sm">
                        <span>📂</span> Load JSON
                    </button>
                </div>
            </div>
        </div>

        <!-- No Data Alert / Placeholder -->
        <template x-if="!data && !loading">
            <div class="bg-gray-900/80 border border-dashed border-gray-700 rounded-2xl p-12 text-center max-w-xl mx-auto my-12 space-y-4">
                <div class="text-5xl">📊</div>
                <h3 class="text-xl font-bold text-white">No Spread Data Loaded</h3>
                <p class="text-sm text-gray-400">
                    No <code class="text-cyan-400 font-mono">report_data.js</code> was detected in this folder. Drop a <code class="text-cyan-400 font-mono">report_data.json</code> file anywhere on this window or click below to browse.
                </p>
                <button @click="document.getElementById('fileInput').click()" class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold transition inline-flex items-center gap-2 shadow-lg shadow-blue-600/20">
                    <span>📂</span> Choose report_data.json
                </button>
            </div>
        </template>

        <!-- Main Dashboard (shown when data is loaded) -->
        <template x-if="data">
            <div class="space-y-6">

                <!-- Top-Line Portfolio Health Cards (Executive Macro-Triage) -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <!-- Prime Intraday Card -->
                    <div class="bg-gray-900/70 border border-emerald-500/30 rounded-xl p-4 flex items-center justify-between shadow-lg shadow-emerald-500/5">
                        <div class="space-y-1">
                            <span class="text-[11px] font-mono uppercase text-emerald-400 font-semibold tracking-wider block">🟢 Prime Intraday</span>
                            <div class="flex items-baseline gap-2">
                                <span class="text-2xl font-bold text-white" x-text="healthStats.primeCount"></span>
                                <span class="text-xs text-gray-400 font-mono" x-text="'(' + healthStats.primePct + '%)'"></span>
                            </div>
                            <span class="text-[11px] text-gray-400 block">Optimal for scalping & EAs</span>
                        </div>
                        <div class="w-10 h-10 rounded-lg bg-emerald-950/80 border border-emerald-800/60 flex items-center justify-center text-xl">⚡</div>
                    </div>

                    <!-- Day-Only Card -->
                    <div class="bg-gray-900/70 border border-amber-500/30 rounded-xl p-4 flex items-center justify-between shadow-lg shadow-amber-500/5">
                        <div class="space-y-1">
                            <span class="text-[11px] font-mono uppercase text-amber-400 font-semibold tracking-wider block">🟡 Day-Only</span>
                            <div class="flex items-baseline gap-2">
                                <span class="text-2xl font-bold text-white" x-text="healthStats.dayOnlyCount"></span>
                                <span class="text-xs text-gray-400 font-mono" x-text="'(' + healthStats.dayOnlyPct + '%)'"></span>
                            </div>
                            <span class="text-[11px] text-gray-400 block">Close prior to NY rollover</span>
                        </div>
                        <div class="w-10 h-10 rounded-lg bg-amber-950/80 border border-amber-800/60 flex items-center justify-center text-xl">🌙</div>
                    </div>

                    <!-- Swing / High Friction Card -->
                    <div class="bg-gray-900/70 border border-rose-500/30 rounded-xl p-4 flex items-center justify-between shadow-lg shadow-rose-500/5">
                        <div class="space-y-1">
                            <span class="text-[11px] font-mono uppercase text-rose-400 font-semibold tracking-wider block">🔴 Caution / Skip</span>
                            <div class="flex items-baseline gap-2">
                                <span class="text-2xl font-bold text-white" x-text="healthStats.skipCount"></span>
                                <span class="text-xs text-gray-400 font-mono" x-text="'(' + healthStats.skipPct + '%)'"></span>
                            </div>
                            <span class="text-[11px] text-gray-400 block">Wide tail risk or widening</span>
                        </div>
                        <div class="w-10 h-10 rounded-lg bg-rose-950/80 border border-rose-800/60 flex items-center justify-center text-xl">⚠️</div>
                    </div>

                    <!-- Portfolio Spread Average Card -->
                    <div class="bg-gray-900/70 border border-cyan-500/30 rounded-xl p-4 flex items-center justify-between shadow-lg shadow-cyan-500/5">
                        <div class="space-y-1">
                            <span class="text-[11px] font-mono uppercase text-cyan-400 font-semibold tracking-wider block">📊 Portfolio Mean Spread</span>
                            <div class="flex items-baseline gap-2">
                                <span class="text-2xl font-bold text-white font-mono" x-text="healthStats.avgSpreadBps + ' bps'"></span>
                            </div>
                            <span class="text-[11px] text-gray-400 font-mono block" x-text="'TWAS: ' + healthStats.avgTwasBps + ' bps'"></span>
                        </div>
                        <div class="w-10 h-10 rounded-lg bg-cyan-950/80 border border-cyan-800/60 flex items-center justify-center text-xl">📈</div>
                    </div>
                </div>

                <!-- Comprehensive Multi-Symbol Summary Table with Preset Views -->
                <div class="bg-gray-900/60 rounded-xl border border-gray-800 overflow-hidden shadow-xl">
                    <div class="p-5 border-b border-gray-800 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                        <div>
                            <h2 class="text-lg font-semibold text-white">Comprehensive Symbol Summary</h2>
                            <p class="text-xs text-gray-400">Adaptive execution analytics • Click column headers to sort • Click any row or [📈 Chart] to isolate 1-minute dynamics</p>
                        </div>
                        
                        <div class="flex flex-wrap items-center gap-3">
                            <!-- View Preset Switcher Tabs -->
                            <div class="inline-flex rounded-lg p-1 bg-gray-950 border border-gray-800 text-xs font-medium">
                                <button @click="activePreset = 'tradeability'" 
                                        :class="activePreset === 'tradeability' ? 'bg-blue-600 text-white shadow' : 'text-gray-400 hover:text-white'" 
                                        class="px-3 py-1.5 rounded-md transition flex items-center gap-1.5">
                                    <span>⚡</span> Tradeability
                                </button>
                                <button @click="activePreset = 'ea_quality'" 
                                        :class="activePreset === 'ea_quality' ? 'bg-emerald-600 text-white shadow' : 'text-gray-400 hover:text-white'" 
                                        class="px-3 py-1.5 rounded-md transition flex items-center gap-1.5">
                                    <span>🤖</span> EA Quality
                                </button>
                                <button @click="activePreset = 'quant_audit'" 
                                        :class="activePreset === 'quant_audit' ? 'bg-purple-600 text-white shadow' : 'text-gray-400 hover:text-white'" 
                                        class="px-3 py-1.5 rounded-md transition flex items-center gap-1.5">
                                    <span>🔬</span> Full Quant Audit
                                </button>
                            </div>

                            <!-- Search Filter -->
                            <div class="relative w-full sm:w-56">
                                <input type="text" x-model="search" placeholder="Filter symbol (e.g. EURUSD)..." class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-1.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 font-mono">
                            </div>
                        </div>
                    </div>

                    <!-- Preset 1: Tradeability & Decision (Default 6 columns, zero scroll fatigue) -->
                    <div x-show="activePreset === 'tradeability'" class="overflow-x-auto custom-scrollbar">
                        <table class="w-full text-left text-sm border-collapse">
                            <thead class="bg-gray-950/80 text-xs uppercase text-gray-400 font-semibold border-b border-gray-800">
                                <tr>
                                    <th @click="sortBy('symbol')" class="sort-th px-4 py-3"><span class="flex items-center gap-1.5">Symbol <span class="text-[10px]" :class="sortCol === 'symbol' ? 'text-blue-400' : 'text-gray-600'" x-text="getSortIcon('symbol')"></span></span></th>
                                    <th class="px-4 py-3">Tradeability Verdict</th>
                                    <th class="px-4 py-3 min-w-[200px]">Spread Corridor (Min · Med · P95 · Max)</th>
                                    <th @click="sortBy('core_spread_bps')" class="sort-th px-4 py-3 text-cyan-400 whitespace-nowrap"><span class="flex items-center gap-1.5">Core Cost (bps) <span class="text-[10px]" :class="sortCol === 'core_spread_bps' ? 'text-blue-400' : 'text-gray-600'" x-text="getSortIcon('core_spread_bps')"></span></span></th>
                                    <th @click="sortBy('rollover_multiplier')" class="sort-th px-4 py-3 text-purple-400 whitespace-nowrap"><span class="flex items-center gap-1.5">Rollover Multiplier <span class="text-[10px]" :class="sortCol === 'rollover_multiplier' ? 'text-blue-400' : 'text-gray-600'" x-text="getSortIcon('rollover_multiplier')"></span></span></th>
                                    <th class="px-4 py-3 text-center">Chart</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-800/60">
                                <template x-for="m in sortedSymbols" :key="m.symbol">
                                    <tr @click="selectSymbol(m.symbol)" :class="selectedSymbol === m.symbol ? 'bg-blue-950/40 border-l-2 border-blue-500' : 'hover:bg-gray-800/50'" class="cursor-pointer transition">
                                        <td class="px-4 py-3">
                                            <div class="font-bold text-blue-400 font-mono text-sm" x-text="m.symbol"></div>
                                            <div class="text-[11px] text-gray-500 font-mono" x-text="m.unit + ' · ' + formatInt(m.total_ticks) + ' ticks'"></div>
                                        </td>
                                        <td class="px-4 py-3 whitespace-nowrap">
                                            <template x-if="getVerdict(m).tier === 'prime'">
                                                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-semibold bg-emerald-950/80 text-emerald-400 border border-emerald-800/60 shadow-sm" :title="getVerdict(m).reason">
                                                    <span>🟢</span> PRIME INTRADAY
                                                </span>
                                            </template>
                                            <template x-if="getVerdict(m).tier === 'day_only'">
                                                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-semibold bg-amber-950/80 text-amber-400 border border-amber-800/60 shadow-sm" :title="getVerdict(m).reason">
                                                    <span>🟡</span> DAY-ONLY
                                                </span>
                                            </template>
                                            <template x-if="getVerdict(m).tier === 'swing'">
                                                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-semibold bg-sky-950/80 text-sky-400 border border-sky-800/60 shadow-sm" :title="getVerdict(m).reason">
                                                    <span>🔵</span> SWING ONLY
                                                </span>
                                            </template>
                                            <template x-if="getVerdict(m).tier === 'skip'">
                                                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-semibold bg-rose-950/80 text-rose-400 border border-rose-800/60 shadow-sm" :title="getVerdict(m).reason">
                                                    <span>🔴</span> HIGH FRICTION / SKIP
                                                </span>
                                            </template>
                                        </td>
                                        <td class="px-4 py-3">
                                            <!-- Inline Visual Corridor Bar -->
                                            <div class="w-full max-w-[240px] space-y-1">
                                                <div class="flex justify-between text-[10px] font-mono text-gray-400">
                                                    <span class="text-emerald-400" x-text="formatNum(m.min_spread)"></span>
                                                    <span class="text-gray-300 font-bold" x-text="'med ' + formatNum(m.median_spread)"></span>
                                                    <span class="text-amber-400" x-text="'p95 ' + formatNum(m.p95_spread)"></span>
                                                    <span class="text-rose-400" x-text="formatNum(m.max_spread)"></span>
                                                </div>
                                                <div class="h-2 w-full bg-gray-950 rounded-full overflow-hidden relative border border-gray-800">
                                                    <!-- Ribbon: Min to P95 -->
                                                    <div class="absolute top-0 bottom-0 bg-blue-500/30 rounded-full"
                                                         :style="'left: ' + getBarPercent(m.min_spread, m) + '%; width: ' + (getBarPercent(m.p95_spread, m) - getBarPercent(m.min_spread, m)) + '%;'"></div>
                                                    <!-- Median Indicator Line -->
                                                    <div class="absolute top-0 bottom-0 w-1 bg-cyan-400 z-10 shadow-sm shadow-cyan-400"
                                                         :style="'left: ' + getBarPercent(m.median_spread, m) + '%;'"></div>
                                                </div>
                                            </div>
                                        </td>
                                        <td class="px-4 py-3">
                                            <div class="font-mono text-cyan-300 font-semibold" x-text="formatNum(m.core_spread_bps || m.spread_bps) + ' bps'"></div>
                                            <div class="text-[11px] text-gray-500 font-mono" x-text="'TWAS: ' + formatNum(m.time_weighted_bps || m.spread_bps) + ' bps'"></div>
                                        </td>
                                        <td class="px-4 py-3">
                                            <span class="px-2 py-0.5 rounded text-xs font-mono font-medium border"
                                                  :class="(m.rollover_multiplier || 1) < 2.0 ? 'bg-emerald-950/80 text-emerald-400 border-emerald-800/60' : ((m.rollover_multiplier || 1) <= 4.0 ? 'bg-amber-950/80 text-amber-400 border-amber-800/60' : 'bg-rose-950/80 text-rose-400 border-rose-800/60')"
                                                  x-text="formatNum(m.rollover_multiplier || 1) + 'x'"></span>
                                        </td>
                                        <td class="px-4 py-3 text-center">
                                            <button @click.stop="selectSymbol(m.symbol)" 
                                                    class="px-2.5 py-1 rounded bg-gray-800 hover:bg-blue-600 text-gray-300 hover:text-white text-xs font-mono transition border border-gray-700">
                                                📈 View
                                            </button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>

                    <!-- Preset 2: EA Quality & Execution Stability (7 columns) -->
                    <div x-show="activePreset === 'ea_quality'" class="overflow-x-auto custom-scrollbar">
                        <table class="w-full text-left text-sm border-collapse">
                            <thead class="bg-gray-950/80 text-xs uppercase text-gray-400 font-semibold border-b border-gray-800">
                                <tr>
                                    <th @click="sortBy('symbol')" class="sort-th px-4 py-3"><span class="flex items-center gap-1.5">Symbol <span class="text-[10px]" :class="sortCol === 'symbol' ? 'text-blue-400' : 'text-gray-600'" x-text="getSortIcon('symbol')"></span></span></th>
                                    <th class="px-4 py-3">Verdict</th>
                                    <th @click="sortBy('time_weighted_bps')" class="sort-th px-4 py-3 text-cyan-300 whitespace-nowrap" title="Time-Weighted Average Spread across continuous duration"><span class="flex items-center gap-1.5">TWAS (bps) <span class="text-[10px]" :class="sortCol === 'time_weighted_bps' ? 'text-blue-400' : 'text-gray-600'" x-text="getSortIcon('time_weighted_bps')"></span></span></th>
                                    <th @click="sortBy('core_spread_bps')" class="sort-th px-4 py-3 text-cyan-400 whitespace-nowrap" title="Core Hours (07:00-20:00 UTC) Median Spread"><span class="flex items-center gap-1.5">Core (bps) <span class="text-[10px]" :class="sortCol === 'core_spread_bps' ? 'text-blue-400' : 'text-gray-600'" x-text="getSortIcon('core_spread_bps')"></span></span></th>
                                    <th @click="sortBy('stability_ratio')" class="sort-th px-4 py-3 text-emerald-400 whitespace-nowrap" title="P95 Spread / Median Spread"><span class="flex items-center gap-1.5">Stability (P95/Med) <span class="text-[10px]" :class="sortCol === 'stability_ratio' ? 'text-blue-400' : 'text-gray-600'" x-text="getSortIcon('stability_ratio')"></span></span></th>
                                    <th @click="sortBy('widening_pct_15x_time')" class="sort-th px-4 py-3 text-amber-400 whitespace-nowrap" title="% of session time spread exceeded 1.5x median"><span class="flex items-center gap-1.5">Widening (>1.5x)% <span class="text-[10px]" :class="sortCol === 'widening_pct_15x_time' ? 'text-blue-400' : 'text-gray-600'" x-text="getSortIcon('widening_pct_15x_time')"></span></span></th>
                                    <th @click="sortBy('rollover_multiplier')" class="sort-th px-4 py-3 text-purple-400 whitespace-nowrap" title="Rollover / Core Multiplier"><span class="flex items-center gap-1.5">Roll Mult <span class="text-[10px]" :class="sortCol === 'rollover_multiplier' ? 'text-blue-400' : 'text-gray-600'" x-text="getSortIcon('rollover_multiplier')"></span></span></th>
                                    <th @click="sortBy('total_ticks')" class="sort-th px-4 py-3 text-gray-400"><span class="flex items-center gap-1.5">Total Ticks <span class="text-[10px]" :class="sortCol === 'total_ticks' ? 'text-blue-400' : 'text-gray-600'" x-text="getSortIcon('total_ticks')"></span></span></th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-800/60">
                                <template x-for="m in sortedSymbols" :key="m.symbol">
                                    <tr @click="selectSymbol(m.symbol)" :class="selectedSymbol === m.symbol ? 'bg-blue-950/40 border-l-2 border-blue-500' : 'hover:bg-gray-800/50'" class="cursor-pointer transition font-mono text-xs">
                                        <td class="px-4 py-3 font-semibold text-blue-400 text-sm" x-text="m.symbol"></td>
                                        <td class="px-4 py-3 whitespace-nowrap font-sans">
                                            <span class="px-2 py-0.5 rounded text-[11px] font-semibold border"
                                                  :class="getVerdictBadgeClass(getVerdict(m).tier)"
                                                  x-text="getVerdict(m).label"></span>
                                        </td>
                                        <td class="px-4 py-3 text-cyan-300 font-bold" x-text="formatNum(m.time_weighted_bps || m.spread_bps) + ' bps'"></td>
                                        <td class="px-4 py-3 text-cyan-400 font-bold" x-text="formatNum(m.core_spread_bps || m.spread_bps) + ' bps'"></td>
                                        <td class="px-4 py-3">
                                            <span class="px-2 py-0.5 rounded font-medium border"
                                                  :class="(m.stability_ratio || 1) < 1.3 ? 'bg-emerald-950/80 text-emerald-400 border-emerald-800/60' : ((m.stability_ratio || 1) <= 2.0 ? 'bg-amber-950/80 text-amber-400 border-amber-800/60' : 'bg-rose-950/80 text-rose-400 border-rose-800/60')"
                                                  x-text="formatNum(m.stability_ratio || 1) + 'x'"></span>
                                        </td>
                                        <td class="px-4 py-3">
                                            <span class="px-2 py-0.5 rounded font-medium border"
                                                  :class="(m.widening_pct_15x_time || 0) < 2 ? 'bg-emerald-950/80 text-emerald-400 border-emerald-800/60' : ((m.widening_pct_15x_time || 0) <= 10 ? 'bg-amber-950/80 text-amber-400 border-amber-800/60' : 'bg-rose-950/80 text-rose-400 border-rose-800/60')"
                                                  x-text="formatNum(m.widening_pct_15x_time || 0) + '%'"></span>
                                        </td>
                                        <td class="px-4 py-3">
                                            <span class="px-2 py-0.5 rounded font-medium border"
                                                  :class="(m.rollover_multiplier || 1) < 2.0 ? 'bg-emerald-950/80 text-emerald-400 border-emerald-800/60' : ((m.rollover_multiplier || 1) <= 5.0 ? 'bg-amber-950/80 text-amber-400 border-amber-800/60' : 'bg-rose-950/80 text-rose-400 border-rose-800/60')"
                                                  x-text="formatNum(m.rollover_multiplier || 1) + 'x'"></span>
                                        </td>

        <!-- Footer -->
        <div class="text-center text-xs text-gray-500 pt-2 pb-6">
            Generated with MetaTrader 5 Spread Analyzer • High-frequency quantitative analytics
        </div>
    </div>

    <script>
        function spreadViewer() {
            return {
                data: null,
                selectedSymbol: '',
                viewMode: 'range_bars',
                activePreset: 'tradeability',
                search: '',
                sortCol: 'symbol',
                sortAsc: true,
                dragOver: false,
                loading: false,

                getVerdict(m) {
                    if (!m) return { tier: 'skip', label: '🔴 HIGH FRICTION / SKIP', reason: 'No data' };
                    const bps = m.spread_bps || 0;
                    const stab = m.stability_ratio || 1.0;
                    const widen = m.widening_pct_15x_time || 0;
                    const roll = m.rollover_multiplier || 1.0;
                    const spVol = m.spread_to_vol_pct || 0;

                    // Hard Stop Criteria: Toxic feed or severe widening
                    if (stab > 2.2 || widen > 12.0 || spVol > 7.5) {
                        return { 
                            tier: 'skip', 
                            label: '🔴 HIGH FRICTION / SKIP', 
                            reason: `High risk: Stability ${stab.toFixed(2)}x, Widening ${widen.toFixed(1)}%, Spread/Vol ${spVol.toFixed(1)}%` 
                        };
                    }

                    // Day-Only Criteria: Clean during the day, but dangerous overnight / rollover widening
                    if (roll > 3.0 || widen > 4.0) {
                        return { 
                            tier: 'day_only', 
                            label: '🟡 DAY-ONLY (AVOID OVERNIGHT)', 
                            reason: `Rollover multiplier ${roll.toFixed(1)}x or widening ${widen.toFixed(1)}%. Close before 21:45 UTC.` 
                        };
                    }

                    // Prime Intraday Criteria: Tight, highly stable, minimal widening
                    if (bps <= 2.5 && stab <= 1.4 && widen <= 3.0 && spVol <= 3.5) {
                        return { 
                            tier: 'prime', 
                            label: '🟢 PRIME INTRADAY & EA', 
                            reason: 'Tight spread, minimal tail widening, and low spread-to-volatility friction.' 
                        };
                    }

                    // Swing / Daily Volatility absorption
                    if (spVol <= 4.5) {
                        return { 
                            tier: 'swing', 
                            label: '🔵 SWING / VOL ONLY', 
                            reason: `Spread is ${bps.toFixed(1)} bps but absorbed by daily volatility (${spVol.toFixed(1)}% of ATR).` 
                        };
                    }

                    return { 
                        tier: 'day_only', 
                        label: '🟡 DAY-ONLY', 
                        reason: 'Standard intraday conditions with moderate rollover or widening risk.' 
                    };
                },

                getVerdictBadgeClass(tier) {
                    if (tier === 'prime') return 'bg-emerald-950/80 text-emerald-400 border-emerald-800/60';
                    if (tier === 'day_only') return 'bg-amber-950/80 text-amber-400 border-amber-800/60';
                    if (tier === 'swing') return 'bg-sky-950/80 text-sky-400 border-sky-800/60';
                    return 'bg-rose-950/80 text-rose-400 border-rose-800/60';
                },

                getBarPercent(val, m) {
                    const min = m.min_spread || 0;
                    const max = m.max_spread || min || 1;
                    const range = Math.max(max - min, 0.0001);
                    const clamped = Math.max(min, Math.min(val || min, max));
                    return Math.round(((clamped - min) / range) * 100);
                },

                get healthStats() {
                    if (!this.data || !this.data.symbols || this.data.symbols.length === 0) {
                        return {
                            primeCount: 0, primePct: 0,
                            dayOnlyCount: 0, dayOnlyPct: 0,
                            skipCount: 0, skipPct: 0,
                            avgSpreadBps: '0.00', avgTwasBps: '0.00'
                        };
                    }
                    const total = this.data.symbols.length;
                    let prime = 0;
                    let dayOnly = 0;
                    let skip = 0;
                    let sumBps = 0;
                    let sumTwas = 0;

                    this.data.symbols.forEach(s => {
                        const v = this.getVerdict(s);
                        if (v.tier === 'prime') prime++;
                        else if (v.tier === 'day_only') dayOnly++;
                        else skip++;

                        sumBps += (s.spread_bps || 0);
                        sumTwas += (s.time_weighted_bps || s.spread_bps || 0);
                    });

                    return {
                        primeCount: prime,
                        primePct: Math.round((prime / total) * 100),
                        dayOnlyCount: dayOnly,
                        dayOnlyPct: Math.round((dayOnly / total) * 100),
                        skipCount: skip,
                        skipPct: Math.round((skip / total) * 100),
                        avgSpreadBps: (sumBps / total).toFixed(2),
                        avgTwasBps: (sumTwas / total).toFixed(2)
                    };
                },

                init() {
                    if (window.__REPORT_DATA__) {
                        this.loadData(window.__REPORT_DATA__);
                        return;
                    }
                    fetch('report_data.json')
                        .then(r => {
                            if (!r.ok) throw new Error('HTTP ' + r.status);
                            return r.json();
                        })
                        .then(json => this.loadData(json))
                        .catch(() => {
                            // No data found on init, waits for drag & drop or file browse
                        });
                },

                loadData(json) {
                    this.data = json;
                    if (json.symbols && json.symbols.length > 0) {
                        this.selectedSymbol = json.symbols[0].symbol;
                        this.$nextTick(() => {
                            this.renderChart();
                        });
                    }
                },

                handleDrop(event) {
                    this.dragOver = false;
                    const file = event.dataTransfer?.files?.[0];
                    if (file) this.readFile(file);
                },

                handleFileInput(event) {
                    const file = event.target.files?.[0];
                    if (file) this.readFile(file);
                },

                readFile(file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const json = JSON.parse(e.target.result);
                            this.loadData(json);
                        } catch (err) {
                            alert('Failed to parse JSON file: ' + err.message);
                        }
                    };
                    reader.readAsText(file);
                },

                get symbolList() {
                    if (!this.data || !this.data.symbols) return [];
                    return this.data.symbols.map(s => s.symbol).sort();
                },

                get sortedSymbols() {
                    if (!this.data || !this.data.symbols) return [];
                    let list = [...this.data.symbols];
                    if (this.search.trim()) {
                        const q = this.search.trim().toUpperCase();
                        list = list.filter(item => item.symbol.toUpperCase().includes(q));
                    }
                    const col = this.sortCol;
                    const asc = this.sortAsc;
                    list.sort((a, b) => {
                        const valA = a[col];
                        const valB = b[col];
                        if (typeof valA === 'number' && typeof valB === 'number') {
                            return asc ? valA - valB : valB - valA;
                        }
                        return asc ? String(valA).localeCompare(String(valB)) : String(valB).localeCompare(String(valA));
                    });
                    return list;
                },

                sortBy(col) {
                    if (this.sortCol === col) {
                        this.sortAsc = !this.sortAsc;
                    } else {
                        this.sortCol = col;
                        this.sortAsc = true;
                    }
                },

                getSortIcon(col) {
                    if (this.sortCol !== col) return '↕';
                    return this.sortAsc ? '▲' : '▼';
                },

                selectSymbol(sym) {
                    this.selectedSymbol = sym;
                    this.renderChart();
                },

                setViewMode(mode) {
                    this.viewMode = mode;
                    this.renderChart();
                },

                formatNum(val, dec = 2) {
                    if (val === undefined || val === null || isNaN(val)) return '-';
                    return Number(val).toFixed(dec);
                },

                formatInt(val) {
                    if (val === undefined || val === null || isNaN(val)) return '-';
                    return Number(val).toLocaleString();
                },

                renderChart() {
                    const container = document.getElementById('chartContainer');
                    if (!container || !this.data || !this.selectedSymbol) return;

                    const symChart = this.data.charts ? this.data.charts[this.selectedSymbol] : null;
                    const symMeta = this.data.symbols.find(s => s.symbol === this.selectedSymbol) || {};
                    const unit = symMeta.unit || 'pts';

                    if (!symChart || !symChart.times || symChart.times.length === 0) {
                        container.innerHTML = `<div class="flex items-center justify-center h-full text-gray-500 font-mono text-sm">No 1-minute chart data available for ${this.selectedSymbol}</div>`;
                        return;
                    }

                    const times = symChart.times;
                    const mins = symChart.min;
                    const avgs = symChart.avg;
                    const maxs = symChart.max;
                    const counts = symChart.ticks;

                    const deltas = maxs.map((m, i) => m - mins[i]);
                    const customdata = times.map((_, i) => [mins[i], avgs[i], maxs[i], counts[i]]);

                    let traces = [];
                    const chartTypeName = this.viewMode === 'range_bars' ? 'Range Bars & Tick Volume' : 'Step Corridor & Tick Volume';

                    if (this.viewMode === 'range_bars') {
                        traces.push({
                            type: 'bar',
                            x: times,
                            base: mins,
                            y: deltas,
                            name: `Spread Range (${unit})`,
                            marker: {
                                color: 'rgba(14, 165, 233, 0.65)',
                                line: { color: '#38BDF8', width: 1.0 }
                            },
                            customdata: customdata,
                            hovertemplate: `<b>%{x|%Y-%m-%d %H:%M} UTC</b><br>Max: <b>%{customdata[2]:.2f} ${unit}</b><br>Avg: <b>%{customdata[1]:.2f} ${unit}</b><br>Min: <b>%{customdata[0]:.2f} ${unit}</b><br>Ticks: %{customdata[3]:,}<extra></extra>`,
                            xaxis: 'x',
                            yaxis: 'y'
                        });

                        traces.push({
                            type: 'scatter',
                            mode: 'lines',
                            x: times,
                            y: avgs,
                            name: `Avg Spread (${unit})`,
                            line: { color: '#F59E0B', width: 1.5 },
                            hoverinfo: 'skip',
                            xaxis: 'x',
                            yaxis: 'y'
                        });
                    } else {
                        traces.push({
                            type: 'scatter',
                            mode: 'lines',
                            x: times,
                            y: mins,
                            name: `Min Spread (${unit})`,
                            line: { color: 'rgba(16, 185, 129, 0.75)', width: 1.2, shape: 'hv' },
                            showlegend: false,
                            hoverinfo: 'skip',
                            xaxis: 'x',
                            yaxis: 'y'
                        });

                        traces.push({
                            type: 'scatter',
                            mode: 'lines',
                            x: times,
                            y: maxs,
                            fill: 'tonexty',
                            fillcolor: 'rgba(244, 63, 94, 0.14)',
                            name: `Min-Max Corridor (${unit})`,
                            line: { color: 'rgba(244, 63, 94, 0.85)', width: 1.2, shape: 'hv' },
                            customdata: customdata,
                            hovertemplate: `<b>%{x|%Y-%m-%d %H:%M} UTC</b><br>Max: <b>%{customdata[2]:.2f} ${unit}</b><br>Avg: <b>%{customdata[1]:.2f} ${unit}</b><br>Min: <b>%{customdata[0]:.2f} ${unit}</b><br>Ticks: %{customdata[3]:,}<extra></extra>`,
                            xaxis: 'x',
                            yaxis: 'y'
                        });

                        traces.push({
                            type: 'scatter',
                            mode: 'lines',
                            x: times,
                            y: avgs,
                            name: `Avg Spread (${unit})`,
                            line: { color: '#F97316', width: 2.0, shape: 'hv' },
                            hoverinfo: 'skip',
                            xaxis: 'x',
                            yaxis: 'y'
                        });
                    }

                    traces.push({
                        type: 'bar',
                        x: times,
                        y: counts,
                        name: 'Tick Count',
                        marker: { color: '#6366F1', opacity: 0.85 },
                        hovertemplate: '<b>%{x|%Y-%m-%d %H:%M} UTC</b><br>Ticks: <b>%{y:,}</b><extra></extra>',
                        xaxis: 'x',
                        yaxis: 'y2'
                    });

                    const is_24_7 = symMeta.is_24_7 || false;
                    const rangebreaks = is_24_7 ? [] : [{ bounds: ['sat', 'mon'] }];

                    const layout = {
                        title: {
                            text: `<b>${this.selectedSymbol}</b> — 1-Minute ${chartTypeName} (${unit})`,
                            font: { size: 18, color: '#F3F4F6' },
                            x: 0.01,
                            y: 0.97
                        },
                        paper_bgcolor: '#111827',
                        plot_bgcolor: '#1F2937',
                        font: { family: 'Inter, sans-serif', color: '#9CA3AF' },
                        margin: { l: 60, r: 30, t: 65, b: 45 },
                        hovermode: 'x',
                        legend: {
                            orientation: 'h',
                            yanchor: 'bottom',
                            y: 1.02,
                            xanchor: 'right',
                            x: 1.0,
                            bgcolor: 'rgba(17, 24, 39, 0.85)',
                            bordercolor: 'rgba(255, 255, 255, 0.1)',
                            borderwidth: 1,
                            font: { size: 12, color: '#E5E7EB' }
                        },
                        grid: {
                            rows: 2,
                            columns: 1,
                            subplots: [['xy'], ['xy2']],
                            roworder: 'top to bottom'
                        },
                        xaxis: {
                            gridcolor: '#374151',
                            gridwidth: 0.5,
                            showline: true,
                            linecolor: '#4B5563',
                            zeroline: false,
                            rangebreaks: rangebreaks,
                            rangeselector: {
                                buttons: [
                                    { count: 1, label: '1D', step: 'day', stepmode: 'backward' },
                                    { count: 3, label: '3D', step: 'day', stepmode: 'backward' },
                                    { count: 7, label: '1W', step: 'day', stepmode: 'backward' },
                                    { step: 'all', label: 'All' }
                                ],
                                bgcolor: '#1F2937',
                                activecolor: '#374151',
                                font: { color: '#E5E7EB', size: 11 }
                            }
                        },
                        yaxis: {
                            title: `Spread (${unit})`,
                            gridcolor: '#374151',
                            gridwidth: 0.5,
                            showline: true,
                            linecolor: '#4B5563',
                            zeroline: false,
                            domain: [0.27, 1.0]
                        },
                        yaxis2: {
                            title: 'Ticks/min',
                            gridcolor: '#374151',
                            gridwidth: 0.5,
                            showline: true,
                            linecolor: '#4B5563',
                            zeroline: false,
                            domain: [0.0, 0.23]
                        }
                    };

                    Plotly.react('chartContainer', traces, layout, {
                        responsive: true,
                        displayModeBar: true,
                        modeBarButtonsToRemove: ['lasso2d', 'select2d']
                    });
                }
            };
        }
    </script>
</body>
</html>
