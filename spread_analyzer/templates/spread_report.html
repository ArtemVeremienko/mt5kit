<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetaTrader 5 Spread Analyzer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Plotly.js CDN -->
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0B0F19;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .sort-th {
            cursor: pointer;
            user-select: none;
            transition: color 0.15s ease;
        }
        .sort-th:hover {
            color: #FFFFFF !important;
        }
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0B0F19;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1F2937;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #374151;
        }
        [x-cloak] { display: none !important; }
    </style>
    <!-- Direct data shim for double-click offline viewing (file://) -->
    <script src="report_data.js"></script>
</head>
<body class="text-gray-200 min-h-screen p-4 md:p-8" x-data="spreadViewer()" x-init="init()" @dragover.prevent="dragOver = true" @dragleave.prevent="dragOver = false" @drop.prevent="handleDrop($event)">

    <!-- Drag & Drop Visual Indicator -->
    <div x-show="dragOver" x-cloak class="fixed inset-0 z-50 bg-blue-900/40 backdrop-blur-sm border-4 border-dashed border-blue-500 flex items-center justify-center pointer-events-none">
        <div class="bg-gray-900 border border-blue-500 px-8 py-6 rounded-2xl shadow-2xl text-center">
            <span class="text-4xl block mb-2">📥</span>
            <span class="text-xl font-bold text-white block">Drop report_data.json here</span>
            <span class="text-xs text-gray-400">Load spread analytics into viewer instantly</span>
        </div>
    </div>

    <div class="max-w-[1440px] mx-auto space-y-6">

        <!-- Header -->
        <div class="flex flex-col md:flex-row md:items-center justify-between border-b border-gray-800 pb-5 gap-4">
            <div>
                <div class="flex items-center gap-3">
                    <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-white">MetaTrader 5 Spread Analyzer</h1>
                    <span class="px-2.5 py-0.5 rounded text-xs font-semibold bg-blue-900/60 text-blue-400 border border-blue-700/50">1-Minute Dynamics</span>
                </div>
                <p class="text-sm text-gray-400 mt-1">High-frequency spread dynamics (Floating Range Bars & Step Corridor with Tick Activity)</p>
            </div>

            <div class="flex flex-wrap items-center gap-3">
                <!-- Metadata Badges -->
                <template x-if="data">
                    <div class="flex items-center gap-4 text-xs font-mono bg-gray-900/80 px-4 py-2.5 rounded-lg border border-gray-800">
                        <div>
                            <span class="text-gray-500 block">ACCOUNT / BROKER</span>
                            <span class="text-gray-200 font-semibold" x-text="data.account_tag || 'Unknown'"></span>
                        </div>
                        <div class="h-6 w-px bg-gray-800"></div>
                        <div>
                            <span class="text-gray-500 block">DATE RANGE (UTC)</span>
                            <span class="text-gray-200 font-semibold" x-text="data.date_range || 'N/A'"></span>
                        </div>
                        <div class="h-6 w-px bg-gray-800"></div>
                        <div>
                            <span class="text-gray-500 block">BASE SPREAD</span>
                            <span class="text-cyan-400 font-semibold" title="Baseline intraday spread drag unpolluted by rollover spikes">MEDIAN (BPS)</span>
                        </div>
                    </div>
                </template>

                <!-- Load File Button -->
                <div>
                    <input type="file" id="fileInput" accept=".json" class="hidden" @change="handleFileInput($event)">
                    <button @click="document.getElementById('fileInput').click()" class="px-3 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300 hover:text-white border border-gray-700 text-xs font-medium transition flex items-center gap-1.5 shadow-sm">
                        <span>📂</span> Load JSON
                    </button>
                </div>
            </div>
        </div>

        <!-- No Data Alert / Placeholder -->
        <template x-if="!data && !loading">
            <div class="bg-gray-900/80 border border-dashed border-gray-700 rounded-2xl p-12 text-center max-w-xl mx-auto my-12 space-y-4">
                <div class="text-5xl">📊</div>
                <h3 class="text-xl font-bold text-white">No Spread Data Loaded</h3>
                <p class="text-sm text-gray-400">
                    No <code class="text-cyan-400 font-mono">report_data.js</code> was detected in this folder. Drop a <code class="text-cyan-400 font-mono">report_data.json</code> file anywhere on this window or click below to browse.
                </p>
                <button @click="document.getElementById('fileInput').click()" class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold transition inline-flex items-center gap-2 shadow-lg shadow-blue-600/20">
                    <span>📂</span> Choose report_data.json
                </button>
            </div>
        </template>

        <!-- Main Dashboard (shown when data is loaded) -->
        <template x-if="data">
            <div class="space-y-6">

                <!-- Top-Line Portfolio Health Cards (Executive Macro-Triage) -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <!-- 1. Prime Intraday Card -->
                    <div @click="toggleVerdictFilter('prime')"
                         class="cursor-pointer bg-gray-900/70 border rounded-xl p-4 flex flex-col justify-between shadow-lg transition"
                         :class="verdictFilter === 'prime' ? 'ring-2 ring-emerald-400 border-emerald-400 bg-gray-900 shadow-emerald-500/20' : 'border-emerald-500/30 hover:border-emerald-500/60 shadow-emerald-500/5'">
                        <div>
                            <div class="flex items-center justify-between">
                                <span class="text-[11px] font-mono uppercase text-emerald-400 font-semibold tracking-wider block">🟢 Prime Intraday</span>
                                <div class="w-8 h-8 rounded-lg bg-emerald-950/80 border border-emerald-800/60 flex items-center justify-center text-base">⚡</div>
                            </div>
                            <div class="flex items-baseline gap-2 mt-1">
                                <span class="text-2xl font-bold text-white" x-text="healthStats.primeCount"></span>
                                <span class="text-xs text-gray-400 font-mono" x-text="'(' + healthStats.primePct + '%)'"></span>
                            </div>
                            <span class="text-[11px] text-gray-400 block mt-0.5">Optimal for scalping & EAs</span>
                        </div>

                        <!-- Matched Symbol Pills -->
                        <div class="mt-3 pt-2.5 border-t border-gray-800/80">
                            <div class="text-[10px] text-gray-500 uppercase font-mono mb-1.5 flex justify-between">
                                <span>Matched Symbols</span>
                                <template x-if="verdictFilter === 'prime'">
                                    <span class="text-emerald-400 font-bold">Filter Active ✕</span>
                                </template>
                            </div>
                            <div class="flex flex-wrap gap-1 max-h-20 overflow-y-auto custom-scrollbar pr-0.5">
                                <template x-for="sym in healthStats.primeSymbols" :key="sym">
                                    <button @click.stop="selectSymbol(sym)"
                                            class="px-2 py-0.5 rounded text-[10px] font-mono transition border"
                                            :class="selectedSymbol === sym ? 'bg-emerald-500 text-gray-950 font-bold border-emerald-400 shadow-sm' : 'bg-gray-800/80 hover:bg-emerald-900/60 text-emerald-300 border-gray-700/80 hover:border-emerald-700/60'"
                                            :title="'Inspect ' + sym"
                                            x-text="sym"></button>
                                </template>
                                <template x-if="healthStats.primeSymbols.length === 0">
                                    <span class="text-[11px] text-gray-500 italic">None</span>
                                </template>
                            </div>
                        </div>
                    </div>

                    <!-- 2. Day-Only Card -->
                    <div @click="toggleVerdictFilter('day_only')"
                         class="cursor-pointer bg-gray-900/70 border rounded-xl p-4 flex flex-col justify-between shadow-lg transition"
                         :class="verdictFilter === 'day_only' ? 'ring-2 ring-amber-400 border-amber-400 bg-gray-900 shadow-amber-500/20' : 'border-amber-500/30 hover:border-amber-500/60 shadow-amber-500/5'">
                        <div>
                            <div class="flex items-center justify-between">
                                <span class="text-[11px] font-mono uppercase text-amber-400 font-semibold tracking-wider block">🟡 Day-Only</span>
                                <div class="w-8 h-8 rounded-lg bg-amber-950/80 border border-amber-800/60 flex items-center justify-center text-base">🌙</div>
                            </div>
                            <div class="flex items-baseline gap-2 mt-1">
                                <span class="text-2xl font-bold text-white" x-text="healthStats.dayOnlyCount"></span>
                                <span class="text-xs text-gray-400 font-mono" x-text="'(' + healthStats.dayOnlyPct + '%)'"></span>
                            </div>
                            <span class="text-[11px] text-gray-400 block mt-0.5">Close prior to NY rollover</span>
                        </div>

                        <!-- Matched Symbol Pills -->
                        <div class="mt-3 pt-2.5 border-t border-gray-800/80">
                            <div class="text-[10px] text-gray-500 uppercase font-mono mb-1.5 flex justify-between">
                                <span>Matched Symbols</span>
                                <template x-if="verdictFilter === 'day_only'">
                                    <span class="text-amber-400 font-bold">Filter Active ✕</span>
                                </template>
                            </div>
                            <div class="flex flex-wrap gap-1 max-h-20 overflow-y-auto custom-scrollbar pr-0.5">
                                <template x-for="sym in healthStats.dayOnlySymbols" :key="sym">
                                    <button @click.stop="selectSymbol(sym)"
                                            class="px-2 py-0.5 rounded text-[10px] font-mono transition border"
                                            :class="selectedSymbol === sym ? 'bg-amber-500 text-gray-950 font-bold border-amber-400 shadow-sm' : 'bg-gray-800/80 hover:bg-amber-900/60 text-amber-300 border-gray-700/80 hover:border-amber-700/60'"
                                            :title="'Inspect ' + sym"
                                            x-text="sym"></button>
                                </template>
                                <template x-if="healthStats.dayOnlySymbols.length === 0">
                                    <span class="text-[11px] text-gray-500 italic">None</span>
                                </template>
                            </div>
                        </div>
                    </div>

                    <!-- 3. Caution / Swing Card -->
                    <div @click="toggleVerdictFilter('caution')"
                         class="cursor-pointer bg-gray-900/70 border rounded-xl p-4 flex flex-col justify-between shadow-lg transition"
                         :class="verdictFilter === 'caution' ? 'ring-2 ring-orange-400 border-orange-400 bg-gray-900 shadow-orange-500/20' : 'border-orange-500/30 hover:border-orange-500/60 shadow-orange-500/5'">
                        <div>
                            <div class="flex items-center justify-between">
                                <span class="text-[11px] font-mono uppercase text-orange-400 font-semibold tracking-wider block">🟠 Caution / Swing</span>
                                <div class="w-8 h-8 rounded-lg bg-orange-950/80 border border-orange-800/60 flex items-center justify-center text-base">⚠️</div>
                            </div>
                            <div class="flex items-baseline gap-2 mt-1">
                                <span class="text-2xl font-bold text-white" x-text="healthStats.cautionCount"></span>
                                <span class="text-xs text-gray-400 font-mono" x-text="'(' + healthStats.cautionPct + '%)'"></span>
                            </div>
                            <span class="text-[11px] text-gray-400 block mt-0.5">Moderate spread, swing or day caution</span>
                        </div>

                        <!-- Matched Symbol Pills -->
                        <div class="mt-3 pt-2.5 border-t border-gray-800/80">
                            <div class="text-[10px] text-gray-500 uppercase font-mono mb-1.5 flex justify-between">
                                <span>Matched Symbols</span>
                                <template x-if="verdictFilter === 'caution'">
                                    <span class="text-orange-400 font-bold">Filter Active ✕</span>
                                </template>
                            </div>
                            <div class="flex flex-wrap gap-1 max-h-20 overflow-y-auto custom-scrollbar pr-0.5">
                                <template x-for="sym in healthStats.cautionSymbols" :key="sym">
                                    <button @click.stop="selectSymbol(sym)"
                                            class="px-2 py-0.5 rounded text-[10px] font-mono transition border"
                                            :class="selectedSymbol === sym ? 'bg-orange-500 text-gray-950 font-bold border-orange-400 shadow-sm' : 'bg-gray-800/80 hover:bg-orange-900/60 text-orange-300 border-gray-700/80 hover:border-orange-700/60'"
                                            :title="'Inspect ' + sym"
                                            x-text="sym"></button>
                                </template>
                                <template x-if="healthStats.cautionSymbols.length === 0">
                                    <span class="text-[11px] text-gray-500 italic">None</span>
                                </template>
                            </div>
                        </div>
                    </div>

                    <!-- 4. High Friction / Skip Card -->
                    <div @click="toggleVerdictFilter('skip')"
                         class="cursor-pointer bg-gray-900/70 border rounded-xl p-4 flex flex-col justify-between shadow-lg transition"
                         :class="verdictFilter === 'skip' ? 'ring-2 ring-rose-400 border-rose-400 bg-gray-900 shadow-rose-500/20' : 'border-rose-500/30 hover:border-rose-500/60 shadow-rose-500/5'">
                        <div>
                            <div class="flex items-center justify-between">
                                <span class="text-[11px] font-mono uppercase text-rose-400 font-semibold tracking-wider block">🔴 High Friction / Skip</span>
                                <div class="w-8 h-8 rounded-lg bg-rose-950/80 border border-rose-800/60 flex items-center justify-center text-base">🛑</div>
                            </div>
                            <div class="flex items-baseline gap-2 mt-1">
                                <span class="text-2xl font-bold text-white" x-text="healthStats.skipCount"></span>
                                <span class="text-xs text-gray-400 font-mono" x-text="'(' + healthStats.skipPct + '%)'"></span>
                            </div>
                            <span class="text-[11px] text-gray-400 block mt-0.5">Toxic feed, widening > 12%</span>
                        </div>

                        <!-- Matched Symbol Pills -->
                        <div class="mt-3 pt-2.5 border-t border-gray-800/80">
                            <div class="text-[10px] text-gray-500 uppercase font-mono mb-1.5 flex justify-between">
                                <span>Matched Symbols</span>
                                <template x-if="verdictFilter === 'skip'">
                                    <span class="text-rose-400 font-bold">Filter Active ✕</span>
                                </template>
                            </div>
                            <div class="flex flex-wrap gap-1 max-h-20 overflow-y-auto custom-scrollbar pr-0.5">
                                <template x-for="sym in healthStats.skipSymbols" :key="sym">
                                    <button @click.stop="selectSymbol(sym)"
                                            class="px-2 py-0.5 rounded text-[10px] font-mono transition border"
                                            :class="selectedSymbol === sym ? 'bg-rose-500 text-gray-950 font-bold border-rose-400 shadow-sm' : 'bg-gray-800/80 hover:bg-rose-900/60 text-rose-300 border-gray-700/80 hover:border-rose-700/60'"
                                            :title="'Inspect ' + sym"
                                            x-text="sym"></button>
                                </template>
                                <template x-if="healthStats.skipSymbols.length === 0">
                                    <span class="text-[11px] text-gray-500 italic">None</span>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Comprehensive Multi-Symbol Summary Table with Preset Views -->
                <div class="bg-gray-900/60 rounded-xl border border-gray-800 overflow-hidden shadow-xl">
                    <div class="p-5 border-b border-gray-800 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                        <div>
                            <h2 class="text-lg font-semibold text-white">Comprehensive Symbol Summary</h2>
                            <p class="text-xs text-gray-400">Adaptive execution analytics • Click column headers to sort • Click any row or [📈 Chart] to isolate 1-minute dynamics</p>
                        </div>
                        
                        <div class="flex flex-wrap items-center gap-3">
                            <!-- View Preset Switcher Tabs -->
                            <div class="inline-flex rounded-lg p-1 bg-gray-950 border border-gray-800 text-xs font-medium">
                                <button @click="activePreset = 'tradeability'" 
                                        :class="activePreset === 'tradeability' ? 'bg-blue-600 text-white shadow' : 'text-gray-400 hover:text-white'" 
                                        class="px-3 py-1.5 rounded-md transition flex items-center gap-1.5">
                                    <span>⚡</span> Tradeability
                                </button>
                                <button @click="activePreset = 'ea_quality'" 
                                        :class="activePreset === 'ea_quality' ? 'bg-emerald-600 text-white shadow' : 'text-gray-400 hover:text-white'" 
                                        class="px-3 py-1.5 rounded-md transition flex items-center gap-1.5">
                                    <span>🤖</span> EA Quality
                                </button>
                                <button @click="activePreset = 'quant_audit'" 
                                        :class="activePreset === 'quant_audit' ? 'bg-purple-600 text-white shadow' : 'text-gray-400 hover:text-white'" 
                                        class="px-3 py-1.5 rounded-md transition flex items-center gap-1.5">
                                    <span>🔬</span> Full Quant Audit
                                </button>
                            </div>

                            <!-- Active Verdict Filter Chip -->
                            <template x-if="verdictFilter">
                                <button @click="verdictFilter = null" 
                                        class="px-2.5 py-1.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-xs font-mono border border-gray-700 text-gray-200 transition flex items-center gap-1.5 shadow-sm">
                                    <span class="text-gray-400">Filter:</span>
                                    <span class="font-bold text-white uppercase" x-text="verdictFilter.replace('_', ' ')"></span>
                                    <span class="text-rose-400 font-bold ml-0.5">✕</span>
                                </button>
                            </template>

                            <!-- Search Filter -->
                            <div class="relative w-full sm:w-56">
                                <input type="text" x-model="search" placeholder="Filter symbol (e.g. EURUSD)..." class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-1.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 font-mono">
                            </div>
                        </div>
                    </div>

                    <!-- Preset 1: Tradeability & Decision (Default 6 columns, zero scroll fatigue) -->
                    <div x-show="activePreset === 'tradeability'" class="overflow-x-auto custom-scrollbar">
                        <table class="w-full text-left text-sm border-collapse">
                            <thead class="bg-gray-950/80 text-xs uppercase text-gray-400 font-semibold border-b border-gray-800">
                                <tr>
                                    <th @click="sortBy('symbol')" class="sort-th px-4 py-3"><span class="flex items-center gap-1.5">Symbol <span class="text-[10px]" :class="sortCol === 'symbol' ? 'text-blue-400' : 'text-gray-600'" x-text="getSortIcon('symbol')"></span></span></th>
                                    <th class="px-4 py-3">Tradeability Verdict</th>
                                    <th class="px-4 py-3 min-w-[320px]">Spread Corridor (Min · Med · P95 · Max)</th>
                                    <th @click="sortBy('core_spread_bps')" class="sort-th px-4 py-3 text-cyan-400 whitespace-nowrap"><span class="flex items-center gap-1.5">Core Cost (bps) <span class="text-[10px]" :class="sortCol === 'core_spread_bps' ? 'text-blue-400' : 'text-gray-600'" x-text="getSortIcon('core_spread_bps')"></span></span></th>
                                    <th @click="sortBy('rollover_multiplier')" class="sort-th px-4 py-3 text-purple-400 whitespace-nowrap"><span class="flex items-center gap-1.5">Rollover Multiplier <span class="text-[10px]" :class="sortCol === 'rollover_multiplier' ? 'text-blue-400' : 'text-gray-600'" x-text="getSortIcon('rollover_multiplier')"></span></span></th>
                                    <th class="px-4 py-3 text-center">Chart</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-800/60">
                                <template x-for="m in sortedSymbols" :key="m.symbol">
                                    <tr @click="selectSymbol(m.symbol)" :class="selectedSymbol === m.symbol ? 'bg-blue-950/40 border-l-2 border-blue-500' : 'hover:bg-gray-800/50'" class="cursor-pointer transition">
                                        <td class="px-4 py-3">
                                            <div class="font-bold text-blue-400 font-mono text-sm" x-text="m.symbol"></div>
                                            <div class="text-[11px] text-gray-500 font-mono" x-text="m.unit + ' · ' + formatInt(m.total_ticks) + ' ticks'"></div>
                                        </td>
                                        <td class="px-4 py-3 whitespace-nowrap font-sans">
                                            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-semibold border shadow-sm"
                                                  :class="getVerdictBadgeClass(getVerdict(m).tier)"
                                                  :title="getVerdict(m).reason"
                                                  x-text="getVerdict(m).label"></span>
                                        </td>
                                        <td class="px-4 py-3">
                                            <!-- Inline Visual Corridor Bar -->
                                            <div class="w-full min-w-[280px] max-w-[340px] space-y-1">
                                                <div class="flex justify-between items-center text-[10px] font-mono text-gray-400 gap-1.5 whitespace-nowrap">
                                                    <span class="text-emerald-400 whitespace-nowrap flex-shrink-0" x-text="formatSpreadVal(m.min_spread)"></span>
                                                    <span class="text-gray-300 font-bold whitespace-nowrap flex-shrink-0" x-text="'med ' + formatSpreadVal(m.median_spread)"></span>
                                                    <span class="text-amber-400 whitespace-nowrap flex-shrink-0" x-text="'p95 ' + formatSpreadVal(m.p95_spread)"></span>
                                                    <div class="flex items-center gap-1 flex-shrink-0 whitespace-nowrap">
                                                        <span class="text-rose-400 whitespace-nowrap" x-text="formatSpreadVal(m.max_spread)"></span>
                                                        <span x-show="(m.max_spread / (m.p95_spread || 1)) >= 3.0" 
                                                              class="whitespace-nowrap flex-shrink-0 inline-flex items-center gap-0.5 px-1.5 py-0.5 text-[9px] font-bold rounded bg-rose-950 text-rose-300 border border-rose-800 leading-none"
                                                              :title="'Extreme tail blowout: ' + ((m.max_spread / (m.p95_spread || 1))).toFixed(1) + 'x P95'">
                                                            <span>⚠️</span><span x-text="((m.max_spread / (m.p95_spread || 1))).toFixed(1) + 'x'"></span>
                                                        </span>
                                                    </div>
                                                </div>
                                                <div class="h-2 w-full bg-gray-950 rounded-full overflow-hidden relative border border-gray-800">
                                                    <!-- Ribbon: Min to P95 -->
                                                    <div class="absolute top-0 bottom-0 bg-blue-500/30 rounded-full"
                                                         :style="'left: ' + getBarPercent(m.min_spread, m) + '%; width: ' + Math.max(getBarPercent(m.p95_spread, m) - getBarPercent(m.min_spread, m), 4) + '%;'"></div>
                                                    <!-- Median Indicator Line -->
                                                    <div class="absolute top-0 bottom-0 w-1 bg-cyan-400 z-10 shadow-sm shadow-cyan-400"
                                                         :style="'left: ' + getBarPercent(m.median_spread, m) + '%;'"></div>
                                                </div>
                                            </div>
                                        </td>
                                        <td class="px-4 py-3">
                                            <div class="font-mono text-cyan-300 font-semibold" x-text="formatNum(m.core_spread_bps || m.spread_bps) + ' bps'"></div>
                                            <div class="text-[11px] text-gray-500 font-mono" x-text="'TWAS: ' + formatNum(m.time_weighted_bps || m.spread_bps) + ' bps'"></div>
                                        </td>
                                        <td class="px-4 py-3">
                                            <span class="px-2 py-0.5 rounded text-xs font-mono font-medium border"

                    const widen = m.widening_pct_15x_time || 0;
                    const roll = m.rollover_multiplier || 1.0;
                    const spVol = m.spread_to_vol_pct || 0;
                    
                    // Tail Blowout Metrics (default 1.0)
                    const blowout = m.tail_blowout_ratio || 1.0;

                    // 1. Hard Stop / Skip (Toxic execution, chronic instability, or severe friction)
                    // Note: Blowout, widening, and stability ratio only force Skip if the spread itself represents actual friction (bps > 2.5 or spVol > 5.0%)
                    // On raw ECN feeds, tight daytime spreads that expand at rollover belong in Day-Only, not Skip!
                    const isSevereFriction = (stab > 2.2 || widen > 12.0) && (bps > 2.5 || spVol > 5.0);
                    const isSevereVolDrag = spVol > 7.5;
                    const isSevereBlowout = (blowout > 4.0 && (bps > 2.5 || spVol > 5.0));

                    if (isSevereFriction || isSevereVolDrag || isSevereBlowout) {
                        return { 
                            tier: 'skip', 
                            label: '🔴 HIGH FRICTION / SKIP', 
                            reason: `Severe risk: Stability ${stab.toFixed(2)}x, Widening ${widen.toFixed(1)}%, Spread/Vol ${spVol.toFixed(1)}%, or Tail Blowout ${blowout.toFixed(1)}x` 
                        };
                    }

                    // 2. Prime Intraday (Ultra-tight spread, rock-solid stability, negligible widening, clean tail, and calm rollover)
                    if (bps <= 2.5 && stab <= 1.4 && widen <= 3.0 && spVol <= 3.5 && blowout <= 2.5 && roll <= 2.5) {
                        return { 
                            tier: 'prime', 
                            label: '🟢 PRIME INTRADAY', 
                            reason: 'Tight spread, minimal tail widening, clean tail (no blowout spikes), and low volatility drag.' 
                        };
                    }

                    // 3. Day-Only (Tight intraday spreads with rollover or off-hours widening, close before NY rollover)
                    if (bps <= 2.5 || roll > 2.5 || blowout > 2.5) {
                        return { 
                            tier: 'day_only', 
                            label: '🟡 DAY-ONLY', 
                            reason: `Intraday spread ${bps.toFixed(2)} bps. Widening ${widen.toFixed(1)}%, Rollover ${roll.toFixed(1)}x, or Tail Blowout ${blowout.toFixed(1)}x — close before NY rollover.` 
                        };
                    }

                    // 4. Caution / Swing (Wider spread bps > 2.5 absorbed by daily volatility spVol <= 5.0%)
                    if (spVol <= 5.0) {
                        return { 
                            tier: 'caution', 
                            label: '🟠 CAUTION / SWING', 
                            reason: `Spread is ${bps.toFixed(1)} bps (>2.5 bps) but absorbed by daily volatility (${spVol.toFixed(1)}% of ATR). Best for swing.` 
                        };
                    }

                    return { 
                        tier: 'caution', 
                        label: '🟠 CAUTION / SWING', 
                        reason: `Moderate spread friction (${bps.toFixed(1)} bps, stability ${stab.toFixed(2)}x). Trade with caution.` 
                    };
                },

                getVerdictBadgeClass(tier) {
                    if (tier === 'prime') return 'bg-emerald-950/80 text-emerald-400 border-emerald-800/60';
                    if (tier === 'day_only') return 'bg-amber-950/80 text-amber-400 border-amber-800/60';
                    if (tier === 'caution') return 'bg-orange-950/80 text-orange-400 border-orange-800/60';
                    return 'bg-rose-950/80 text-rose-400 border-rose-800/60';
                },

                getBarPercent(val, m) {
                    const min = m.min_spread || 0;
                    // Anti-squash ceiling: robust ceiling scaled to max(P99, P95 * 1.25) so extreme spikes don't compress the active ribbon
                    const robustMax = Math.max(m.p99_spread || m.p95_spread || 0, (m.p95_spread || 0) * 1.25);
                    const ceil = robustMax > min ? robustMax : (m.max_spread || min || 1);
                    const range = Math.max(ceil - min, 0.0001);
                    const clamped = Math.max(min, Math.min(val || min, ceil));
                    return Math.round(((clamped - min) / range) * 100);
                },

                get healthStats() {
                    if (!this.data || !this.data.symbols || this.data.symbols.length === 0) {
                        return {
                            primeCount: 0, primePct: 0, primeSymbols: [],
                            dayOnlyCount: 0, dayOnlyPct: 0, dayOnlySymbols: [],
                            cautionCount: 0, cautionPct: 0, cautionSymbols: [],
                            skipCount: 0, skipPct: 0, skipSymbols: [],
                        };
                    }
                    const total = this.data.symbols.length;
                    const primeSyms = [];
                    const dayOnlySyms = [];
                    const cautionSyms = [];
                    const skipSyms = [];

                    this.data.symbols.forEach(s => {
                        const v = this.getVerdict(s);
                        if (v.tier === 'prime') primeSyms.push(s.symbol);
                        else if (v.tier === 'day_only') dayOnlySyms.push(s.symbol);
                        else if (v.tier === 'caution') cautionSyms.push(s.symbol);
                        else skipSyms.push(s.symbol);
                    });

                    return {
                        primeCount: primeSyms.length,
                        primePct: Math.round((primeSyms.length / total) * 100),
                        primeSymbols: primeSyms.sort(),

                        dayOnlyCount: dayOnlySyms.length,
                        dayOnlyPct: Math.round((dayOnlySyms.length / total) * 100),
                        dayOnlySymbols: dayOnlySyms.sort(),

                        cautionCount: cautionSyms.length,
                        cautionPct: Math.round((cautionSyms.length / total) * 100),
                        cautionSymbols: cautionSyms.sort(),

                        skipCount: skipSyms.length,
                        skipPct: Math.round((skipSyms.length / total) * 100),
                        skipSymbols: skipSyms.sort(),
                    };
                },

                init() {
                    if (window.__REPORT_DATA__) {
                        this.loadData(window.__REPORT_DATA__);
                        return;
                    }
                    fetch('report_data.json')
                        .then(r => {
                            if (!r.ok) throw new Error('HTTP ' + r.status);
                            return r.json();
                        })
                        .then(json => this.loadData(json))
                        .catch(() => {
                            // No data found on init, waits for drag & drop or file browse
                        });
                },

                loadData(json) {
                    this.data = json;
                    if (json.symbols && json.symbols.length > 0) {
                        this.selectedSymbol = json.symbols[0].symbol;
                        this.$nextTick(() => {
                            this.renderChart();
                        });
                    }
                },

                handleDrop(event) {
                    this.dragOver = false;
                    const file = event.dataTransfer?.files?.[0];
                    if (file) this.readFile(file);
                },

                handleFileInput(event) {
                    const file = event.target.files?.[0];
                    if (file) this.readFile(file);
                },

                readFile(file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const json = JSON.parse(e.target.result);
                            this.loadData(json);
                        } catch (err) {
                            alert('Failed to parse JSON file: ' + err.message);
                        }
                    };
                    reader.readAsText(file);
                },

                get symbolList() {
                    if (!this.data || !this.data.symbols) return [];
                    return this.data.symbols.map(s => s.symbol).sort();
                },

                get sortedSymbols() {
                    if (!this.data || !this.data.symbols) return [];
                    let list = [...this.data.symbols];
                    if (this.verdictFilter) {
                        list = list.filter(item => this.getVerdict(item).tier === this.verdictFilter);
                    }
                    if (this.search.trim()) {
                        const q = this.search.trim().toUpperCase();
                        list = list.filter(item => item.symbol.toUpperCase().includes(q));
                    }
                    const col = this.sortCol;
                    const asc = this.sortAsc;
                    list.sort((a, b) => {
                        const valA = a[col];
                        const valB = b[col];
                        if (typeof valA === 'number' && typeof valB === 'number') {
                            return asc ? valA - valB : valB - valA;
                        }
                        return asc ? String(valA).localeCompare(String(valB)) : String(valB).localeCompare(String(valA));
                    });
                    return list;
                },

                sortBy(col) {
                    if (this.sortCol === col) {
                        this.sortAsc = !this.sortAsc;
                    } else {
                        this.sortCol = col;
                        this.sortAsc = true;
                    }
                },

                getSortIcon(col) {
                    if (this.sortCol !== col) return '↕';
                    return this.sortAsc ? '▲' : '▼';
                },

                selectSymbol(sym) {
                    this.selectedSymbol = sym;
                    this.renderChart();
                    this.$nextTick(() => {
                        const chartEl = document.getElementById('chartSection');
                        if (chartEl) {
                            chartEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }
                    });
                },

                setViewMode(mode) {
                    this.viewMode = mode;
                    this.renderChart();
                },

                formatNum(val, dec = 2) {
                    if (val === undefined || val === null || isNaN(val)) return '-';
                    return Number(val).toFixed(dec);
                },

                formatSpreadVal(val) {
                    if (val === undefined || val === null || isNaN(val)) return '-';
                    const num = Number(val);
                    if (num >= 1000) return num.toFixed(0);
                    if (num >= 100) return num.toFixed(1);
                    return num.toFixed(2);
                },

                formatInt(val) {
                    if (val === undefined || val === null || isNaN(val)) return '-';
                    return Number(val).toLocaleString();
                },

                renderChart() {
                    const container = document.getElementById('chartContainer');
                    if (!container || !this.data || !this.selectedSymbol) return;

                    const symChart = this.data.charts ? this.data.charts[this.selectedSymbol] : null;
                    const symMeta = this.data.symbols.find(s => s.symbol === this.selectedSymbol) || {};
                    const unit = symMeta.unit || 'pts';

                    if (!symChart || !symChart.times || symChart.times.length === 0) {
                        container.innerHTML = `<div class="flex items-center justify-center h-full text-gray-500 font-mono text-sm">No 1-minute chart data available for ${this.selectedSymbol}</div>`;
                        return;
                    }

                    const times = symChart.times;
                    const mins = symChart.min;
                    const avgs = symChart.avg;
                    const maxs = symChart.max;
                    const counts = symChart.ticks;

                    const deltas = maxs.map((m, i) => m - mins[i]);
                    const customdata = times.map((_, i) => [mins[i], avgs[i], maxs[i], counts[i]]);

                    let traces = [];
                    const chartTypeName = this.viewMode === 'range_bars' ? 'Range Bars & Tick Volume' : 'Step Corridor & Tick Volume';

                    if (this.viewMode === 'range_bars') {
                        traces.push({
                            type: 'bar',
                            x: times,
                            base: mins,
                            y: deltas,
                            name: `Spread Range (${unit})`,
                            marker: {
                                color: 'rgba(14, 165, 233, 0.65)',
                                line: { color: '#38BDF8', width: 1.0 }
                            },
                            customdata: customdata,
                            hovertemplate: `<b>%{x|%Y-%m-%d %H:%M} UTC</b><br>Max: <b>%{customdata[2]:.2f} ${unit}</b><br>Avg: <b>%{customdata[1]:.2f} ${unit}</b><br>Min: <b>%{customdata[0]:.2f} ${unit}</b><br>Ticks: %{customdata[3]:,}<extra></extra>`,
                            xaxis: 'x',
                            yaxis: 'y'
                        });

                        traces.push({
                            type: 'scatter',
                            mode: 'lines',
                            x: times,
                            y: avgs,
                            name: `Avg Spread (${unit})`,
                            line: { color: '#F59E0B', width: 1.5 },
                            hoverinfo: 'skip',
                            xaxis: 'x',
                            yaxis: 'y'
                        });
                    } else {
                        traces.push({
                            type: 'scatter',
                            mode: 'lines',
                            x: times,
                            y: mins,
                            name: `Min Spread (${unit})`,
                            line: { color: 'rgba(16, 185, 129, 0.75)', width: 1.2, shape: 'hv' },
                            showlegend: false,
                            hoverinfo: 'skip',
                            xaxis: 'x',
                            yaxis: 'y'
                        });

                        traces.push({
                            type: 'scatter',
                            mode: 'lines',
                            x: times,
                            y: maxs,
                            fill: 'tonexty',
                            fillcolor: 'rgba(244, 63, 94, 0.14)',
                            name: `Min-Max Corridor (${unit})`,
                            line: { color: 'rgba(244, 63, 94, 0.85)', width: 1.2, shape: 'hv' },
                            customdata: customdata,
                            hovertemplate: `<b>%{x|%Y-%m-%d %H:%M} UTC</b><br>Max: <b>%{customdata[2]:.2f} ${unit}</b><br>Avg: <b>%{customdata[1]:.2f} ${unit}</b><br>Min: <b>%{customdata[0]:.2f} ${unit}</b><br>Ticks: %{customdata[3]:,}<extra></extra>`,
                            xaxis: 'x',
                            yaxis: 'y'
                        });

                        traces.push({
                            type: 'scatter',
                            mode: 'lines',
                            x: times,
                            y: avgs,
                            name: `Avg Spread (${unit})`,
                            line: { color: '#F97316', width: 2.0, shape: 'hv' },
                            hoverinfo: 'skip',
                            xaxis: 'x',
                            yaxis: 'y'
                        });
                    }

                    traces.push({
                        type: 'bar',
                        x: times,
                        y: counts,
                        name: 'Tick Count',
                        marker: { color: '#6366F1', opacity: 0.85 },
                        hovertemplate: '<b>%{x|%Y-%m-%d %H:%M} UTC</b><br>Ticks: <b>%{y:,}</b><extra></extra>',
                        xaxis: 'x',
                        yaxis: 'y2'
                    });

                    const is_24_7 = symMeta.is_24_7 || false;
                    const rangebreaks = is_24_7 ? [] : [{ bounds: ['sat', 'mon'] }];

                    const layout = {
                        title: {
                            text: `<b>${this.selectedSymbol}</b> — 1-Minute ${chartTypeName} (${unit})`,
                            font: { size: 18, color: '#F3F4F6' },
                            x: 0.01,
                            y: 0.97
                        },
                        paper_bgcolor: '#111827',
                        plot_bgcolor: '#1F2937',
                        font: { family: 'Inter, sans-serif', color: '#9CA3AF' },
                        margin: { l: 60, r: 30, t: 65, b: 45 },
                        hovermode: 'x',
                        legend: {
                            orientation: 'h',
                            yanchor: 'bottom',
                            y: 1.02,
                            xanchor: 'right',
                            x: 1.0,
                            bgcolor: 'rgba(17, 24, 39, 0.85)',
                            bordercolor: 'rgba(255, 255, 255, 0.1)',
                            borderwidth: 1,
                            font: { size: 12, color: '#E5E7EB' }
                        },
                        grid: {
                            rows: 2,
                            columns: 1,
                            subplots: [['xy'], ['xy2']],
                            roworder: 'top to bottom'
                        },
                        xaxis: {
                            gridcolor: '#374151',
                            gridwidth: 0.5,
                            showline: true,
                            linecolor: '#4B5563',
                            zeroline: false,
                            rangebreaks: rangebreaks,
                            rangeselector: {
                                buttons: [
                                    { count: 1, label: '1D', step: 'day', stepmode: 'backward' },
                                    { count: 3, label: '3D', step: 'day', stepmode: 'backward' },
                                    { count: 7, label: '1W', step: 'day', stepmode: 'backward' },
                                    { step: 'all', label: 'All' }
                                ],
                                bgcolor: '#1F2937',
                                activecolor: '#374151',
                                font: { color: '#E5E7EB', size: 11 }
                            }
                        },
                        yaxis: {
                            title: `Spread (${unit})`,
                            gridcolor: '#374151',
                            gridwidth: 0.5,
                            showline: true,
                            linecolor: '#4B5563',
                            zeroline: false,
                            domain: [0.27, 1.0]
                        },
                        yaxis2: {
                            title: 'Ticks/min',
                            gridcolor: '#374151',
                            gridwidth: 0.5,
                            showline: true,
                            linecolor: '#4B5563',
                            zeroline: false,
                            domain: [0.0, 0.23]
                        }
                    };

                    Plotly.react('chartContainer', traces, layout, {
                        responsive: true,
                        displayModeBar: true,
                        modeBarButtonsToRemove: ['lasso2d', 'select2d']
                    });
                }
            };
        }
    </script>
</body>
